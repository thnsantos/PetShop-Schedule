<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">

  <title>PetShop Schedule</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>

<body>
  
  <div class="logo flex">
    <a href="#schedule">
      <img src="./assets/logo.png" alt="Logo Mundo Pet"> 
    </a>
  </div>

  <main id="schedule" class="schedule">
    <header>
      <div class="schedule-heading">
        <h1>Sua agenda</h1>
        <p>Aqui você pode ver todos os clientes e serviços agendados para hoje.</p>
      </div>

      <div class="schedule-date">
        <label for="schedule-date">Data</label>
        <input id="schedule-date" type="date"> 
      </div>
    </header>

    <section class="schedule-period">
      <h2>Manhã</h2>
      <p>09h-12h</p>
    </section>

    <section class="schedule-period">
      <h2>Tarde</h2>
      <p>13h-18h</p>
    </section>

    <section class="schedule-period">
      <h2>Noite</h2>
      <p>19h-21h</p>
    </section>
    
    <button type="button">Novo Agendamento</button>
  </main>
</body>

</html>
